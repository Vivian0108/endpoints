name: Auto Request Review

# pull_request_target (not pull_request): GITHUB_TOKEN is read-only for PRs
# opened from forks, and requesting reviewers needs pull-requests: write.
# Runs in the base repo's context, so this workflow must never check out or
# execute PR-provided code — it only reads PR metadata through the API.
on:
  pull_request_target:
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-review:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Auto request review
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo, number } = context.issue;

            // Default reviewers for all components
            const defaultReviewers = ['nvzhihanj','arekay-nv'];

            // Component-specific reviewers (you can expand this later)
            const componentReviewers = {
              'src/inference_endpoint/load_generator/': ['nvzhihanj','arekay-nv'],
              'src/inference_endpoint/dataset_manager/': ['nvzhihanj','arekay-nv'],
              'src/inference_endpoint/endpoint_client/': ['nvzhihanj','arekay-nv'],
              'src/inference_endpoint/metrics/': ['nvzhihanj','arekay-nv'],
              'src/inference_endpoint/config/': ['nvzhihanj','arekay-nv'],
              'src/inference_endpoint/plugins/': ['nvzhihanj','arekay-nv'],
            };

            // Get changed files (paginated: listFiles returns 30 per page by
            // default, which would truncate large PRs)
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: number,
              per_page: 100,
            });

            // Get PR author
            const { data: pullRequest } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: number,
            });
            const prAuthor = pullRequest.user.login;

            // Determine which reviewers to request based on changed files
            let reviewersToRequest = new Set(defaultReviewers);

            for (const file of files) {
              for (const [component, reviewers] of Object.entries(componentReviewers)) {
                if (file.filename.startsWith(component)) {
                  reviewers.forEach(reviewer => reviewersToRequest.add(reviewer));
                }
              }
            }

            // Exclude PR author from reviewers
            reviewersToRequest.delete(prAuthor);

            // Request reviews
            if (reviewersToRequest.size > 0) {
              const reviewers = Array.from(reviewersToRequest);
              try {
                await github.rest.pulls.requestReviewers({
                  owner,
                  repo,
                  pull_number: number,
                  reviewers,
                });
                console.log(`Requested review from: ${reviewers.join(', ')}`);
              } catch (error) {
                // 422 means a reviewer is not a collaborator; skip the request
                // instead of failing the whole workflow.
                if (error.status === 422) {
                  core.warning(`Could not request review: ${error.message}`);
                } else {
                  throw error;
                }
              }
            }
